name: internal-better-auth-gateway

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./app/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mock-idp-keygen:
    image: alpine/openssl:latest
    entrypoint: ["sh", "/mock-idp/gen-keys.sh"]
    volumes:
      - ./infra/mock-idp:/mock-idp

  mock-idp:
    image: boxyhq/mock-saml:latest
    restart: unless-stopped
    depends_on:
      mock-idp-keygen:
        condition: service_completed_successfully
    environment:
      APP_URL: http://localhost:4000
      ENTITY_ID: https://mock-okta.local/entityid
    entrypoint:
      - sh
      - -c
      - |
        PUBLIC_KEY="$$(base64 /keys/idp-cert.pem | tr -d '\n')"
        PRIVATE_KEY="$$(base64 /keys/idp-key.pem | tr -d '\n')"
        export PUBLIC_KEY PRIVATE_KEY
        exec docker-entrypoint.sh node server.js
    volumes:
      - ./infra/mock-idp/keys:/keys:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname):4000/api/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
